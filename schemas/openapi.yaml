components:
  # securitySchemes:
  #   cookieAuth:
  #     type: apiKey
  #     in: cookie
  #     name: Session
  #   basicAuth:
  #     type: http
  #     scheme: basic
  schemas:
    PartnerRestaurant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          readOnly: true
        schema_name:
          type: string
          maxLength: 63
        address:
          type: string
          readOnly: true
        website:
          type: string
          readOnly: true
        latitude:
          type: number
          format: float
          readOnly: true
        longitude:
          type: number
          format: float
          readOnly: true
        timezone:
          type: string
          readOnly: true
      required:
      - schema_name
    PartnerWebhook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 500
          pattern: "^(?:[a-z0-9\\.\\-\\+]*)://(?:\\S+(?::\\S*)?@)?(?:(?:25[0-5]|2[0-4]\\\
            d|[0-1]?\\d?\\d)(?:\\.(?:25[0-5]|2[0-4]\\d|[0-1]?\\d?\\d)){3}|\\[[0-9a-f:\\\
            .]+\\]|([a-z\xA1-\uFFFF0-9](?:[a-z\xA1-\uFFFF0-9-]{0,61}[a-z\xA1-\uFFFF\
            0-9])?(?:\\.(?!-)[a-z\xA1-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z\xA1\
            -\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\.?|localhost))(?::\\d{2,5})?(?:[/?#][^\\\
            s]*)?\\Z"
        name:
          type: string
          nullable: true
          maxLength: 125
        is_enabled:
          type: boolean
        last_use_at:
          type: string
          format: date-time
          nullable: true
        last_response_status_code:
          type: integer
          maximum: 32767
          nullable: true
          minimum: 0
        last_response:
          type: object
          additionalProperties: {}
          nullable: true
        subscribed_events:
          type: object
          additionalProperties: {}
          nullable: true
      required:
      - url
    PartnerRestaurantReservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          nullable: true
          maxLength: 255
        last_name:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 128
        start_time:
          type: string
          format: date-time
        duration:
          type: string
          readOnly: true
        adults:
          type: integer
          maximum: 50
          minimum: 1
        children:
          type: integer
          maximum: 50
        comment:
          type: string
          nullable: true
        cancelled:
          type: boolean
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        confirmed:
          type: boolean
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        confirmation_mode:
          enum:
          - CONFIRMATION_MODE_SYNCHRONOUS
          - CONFIRMATION_MODE_ASYNCHRONOUS
          type: string
        arrived:
          type: boolean
        arrived_at:
          type: string
          format: date-time
          nullable: true
        no_show:
          type: boolean
        no_show_at:
          type: string
          format: date-time
          nullable: true
        language:
          type: string
        metadata:
          type: object
          additionalProperties: {}
          nullable: true
      required:
      - start_time
      - adults
    PatchedPartnerWebhook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 500
          pattern: "^(?:[a-z0-9\\.\\-\\+]*)://(?:\\S+(?::\\S*)?@)?(?:(?:25[0-5]|2[0-4]\\\
            d|[0-1]?\\d?\\d)(?:\\.(?:25[0-5]|2[0-4]\\d|[0-1]?\\d?\\d)){3}|\\[[0-9a-f:\\\
            .]+\\]|([a-z\xA1-\uFFFF0-9](?:[a-z\xA1-\uFFFF0-9-]{0,61}[a-z\xA1-\uFFFF\
            0-9])?(?:\\.(?!-)[a-z\xA1-\uFFFF0-9-]{1,63}(?<!-))*\\.(?!-)(?:[a-z\xA1\
            -\uFFFF-]{2,63}|xn--[a-z0-9]{1,59})(?<!-)\\.?|localhost))(?::\\d{2,5})?(?:[/?#][^\\\
            s]*)?\\Z"
        name:
          type: string
          nullable: true
          maxLength: 125
        is_enabled:
          type: boolean
        last_use_at:
          type: string
          format: date-time
          nullable: true
        last_response_status_code:
          type: integer
          maximum: 32767
          nullable: true
          minimum: 0
        last_response:
          type: object
          additionalProperties: {}
          nullable: true
        subscribed_events:
          type: object
          additionalProperties: {}
          nullable: true
    PatchedPartnerRestaurantReservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          nullable: true
          maxLength: 255
        last_name:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 128
        start_time:
          type: string
          format: date-time
        duration:
          type: string
          readOnly: true
        adults:
          type: integer
          maximum: 50
          minimum: 1
        children:
          type: integer
          maximum: 50
        comment:
          type: string
          nullable: true
        cancelled:
          type: boolean
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        confirmed:
          type: boolean
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        confirmation_mode:
          enum:
          - CONFIRMATION_MODE_SYNCHRONOUS
          - CONFIRMATION_MODE_ASYNCHRONOUS
          type: string
        arrived:
          type: boolean
        arrived_at:
          type: string
          format: date-time
          nullable: true
        no_show:
          type: boolean
        no_show_at:
          type: string
          format: date-time
          nullable: true
        language:
          type: string
        metadata:
          type: object
          additionalProperties: {}
          nullable: true
