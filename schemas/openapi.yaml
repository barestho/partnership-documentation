  /api/v1/partnership/profile/:
    get:
      operationId: profile_list
      description: ''
      summary: 'Retrieve the partner profile'
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
